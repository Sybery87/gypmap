name = "gyp-arac-servisi"
main = "src/index.js"
compatibility_date = "2026-01-01"

# Token, adres ve oturum anahtari BURAYA YAZILMAZ. Terminalden:
#   npx wrangler secret put MOBILIZ_TOKEN
#   npx wrangler secret put MOBILIZ_BASE_URL
#   npx wrangler secret put TOKEN_HEADER
#   npx wrangler secret put OTURUM_ANAHTARI
#
# OTURUM_ANAHTARI: yetkili girislerini imzalayan gizli anahtar. Uzun ve
# rastgele bir metin olmali. Uretmek icin:
#   node -e "console.log(require('crypto').randomBytes(32).toString('hex'))"

# Kullanicilar bu KV'de saklanir. Once olusturun:
#   npx wrangler kv namespace create KULLANICILAR
# Ekrana cikan "id" degerini asagiya yapistirin.
[[kv_namespaces]]
binding = "KULLANICILAR"
id = "BURAYA_KV_ID_YAZIN"

[vars]
# Sitenin adresi. Yalnizca burada yazan adresten gelen istekler kabul edilir.
#
# DIKKAT: guncelleme yaparken bu dosyayi ustune kopyalarsaniz kendi adresiniz
# silinir ve site "arac verisi alinamadi" der. Guncellemeden once bu satiri
# kontrol edin.
#
# Yol (path) YAZMAYIN - tarayici yalnizca alan adini gonderir:
#   dogru : https://kullanici.github.io
#   yanlis: https://kullanici.github.io/depo
ALLOWED_ORIGINS = "https://sybery87.github.io"
